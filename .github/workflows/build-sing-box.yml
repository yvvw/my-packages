name: Build sing-box

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: "1.14.1"
      ref:
        type: string
        default: "testing"

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
        with:
          repository: "SagerNet/sing-box"
          ref: "${{ inputs.ref }}"

      - uses: actions/checkout@main
        with:
          path: build_repo
          sparse-checkout: sing-box

      - id: go-version
        run: |
          echo "go-version=$(grep -m 1 -oP 'go-version:\s*\K[0-9.]+' .github/workflows/build.yml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@main
        with:
          go-version: ${{ steps.go-version.outputs.go-version }}

      - run: |
          git tag ${{ inputs.version }} -f

          cp build_repo/sing-box/.goreleaser.yaml . \
            && rm -rf build_repo/sing-box/patch/experimental/tools_generate/go.{mod,sum} \
            && cp -a build_repo/sing-box/patch/. . \
            && rm -rf build_repo
          go mod tidy

      - uses: goreleaser/goreleaser-action@master
        with:
          args: release --snapshot --clean

      - uses: dev-drprasad/delete-older-releases@v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          keep_latest: 0
          delete_tags: true
          delete_tag_pattern: sing-box

      - uses: softprops/action-gh-release@v2
        with:
          name: sing-box
          tag_name: sing-box
          files: dist/*.{tar.gz,zip}
